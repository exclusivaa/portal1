body{font-family:'DM Sans',sans-serif;background:#f5f4f0;color:#1a1020;font-size:14px}

#login-page{min-height:100vh;display:flex}
.login-esq{flex:1;background:#3d1045;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 48px;gap:24px}

.login-dir{width:480px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 48px}
.login-titulo{font-family:'Syne',sans-serif;font-size:26px;font-weight:700;color:var(--roxo);margin-bottom:6px;align-self:flex-start}
.login-sub{font-size:13px;color:#9a8aa2;margin-bottom:36px;align-self:flex-start}
.form-grupo{width:100%;margin-bottom:18px}
.form-label{display:block;font-size:12px;font-weight:500;color:#5a4d62;margin-bottom:6px}
.form-input{width:100%;padding:12px 16px;background:#f5f4f0;border:1.5px solid rgba(0,0,0,.14);border-radius:10px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none}
.form-input:focus{border-color:var(--roxo);background:#fff}
.btn-entrar{width:100%;padding:14px;background:var(--roxo);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;font-family:'Syne',sans-serif;cursor:pointer;margin-top:6px}

.erro{width:100%;padding:12px;background:#fee2e2;border:1px solid #fca5a5;border-radius:8px;color:#dc2626;font-size:13px;margin-bottom:14px;display:none}
#portal-page{display:none;min-height:100vh}
.layout{display:flex;min-height:100vh}
.sidebar{width:260px;min-height:100vh;background:#1a0a1e;display:flex;flex-direction:column;position:fixed;top:0;left:0}
.sb-logo{padding:20px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:12px}

.fl{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#9a8aa2}

.kp-lb{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#9a8aa2;margin-bottom:8px}

.kp-sb{font-size:11px;color:#9a8aa2}
.kmini{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.km{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:10px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.km-lb{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#9a8aa2;margin-bottom:3px}
.km-vl{font-family:'Syne',sans-serif;font-size:16px;font-weight:700}
.pill{font-size:10px;padding:3px 9px;border-radius:100px;font-weight:500}
.pg{background:#dcfce7;color:#16a34a}.pr{background:#fee2e2;color:#dc2626}.pb{background:#dbeafe;color:#2563eb}.py{background:rgba(255,190,0,.15);color:#7a5800}
.charts{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:16px}
.cc{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:12px;padding:18px}
.cc-titulo{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--roxo);margin-bottom:3px}
.cc-sub{font-size:11px;color:#9a8aa2;margin-bottom:12px}
.tbl-card{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:12px;overflow:hidden;margin-bottom:24px}
.tbl-hdr{padding:12px 18px;border-bottom:1px solid rgba(0,0,0,.08);display:flex;align-items:center;justify-content:space-between}
.tbl-titulo{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--roxo)}
.tbl-filt{padding:8px 18px;background:#f5f4f0;border-bottom:1px solid rgba(0,0,0,.08);display:flex;gap:8px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}
th{padding:9px 18px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#9a8aa2;background:#f5f4f0;border-bottom:1px solid rgba(0,0,0,.08);font-weight:500}
td{padding:10px 18px;font-size:13px;color:#5a4d62;border-bottom:1px solid rgba(0,0,0,.08)}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f9f8fa}
td.desc{color:#1a1020;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.val{font-family:'Syne',sans-serif;font-weight:600;text-align:right;white-space:nowrap}
td.ent{color:#16a34a}td.sai{color:#dc2626}
.badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:500}
.b-realizado{background:#dcfce7;color:#16a34a}.b-previsto{background:#dbeafe;color:#2563eb}
.b-entrada{background:#dcfce7;color:#16a34a}.b-saida{background:#fee2e2;color:#dc2626}
.pag{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-top:1px solid rgba(0,0,0,.08);font-size:12px;color:#9a8aa2}
.pag-btns{display:flex;gap:4px}
.pb2{background:#f5f4f0;border:1.5px solid rgba(0,0,0,.14);color:#5a4d62;padding:3px 9px;border-radius:5px;cursor:pointer;font-size:11px}
.pb2:hover{border-color:var(--roxo);color:var(--roxo)}.pb2.at{background:var(--roxo);border-color:var(--roxo);color:#fff}.pb2:disabled{opacity:.3;cursor:not-allowed}
.load{display:flex;align-items:center;justify-content:center;padding:40px;color:#9a8aa2;gap:8px}
.spin{width:16px;height:16px;border:2px solid rgba(0,0,0,.1);border-top-color:var(--roxo);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.vazio{display:flex;align-items:center;justify-content:center;padding:40px;color:#9a8aa2;font-size:13px}
</style>
</head>

<script>
const SB_URL = 'https://ckfuwprixltrqzrupztc.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrZnV3cHJpeGx0cnF6cnVwenRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NTY3MjMsImV4cCI6MjA5MTMzMjcyM30.KNtaU2RctftGfx6vwZAal9WcXB_YbTI8PckFlllveLg';

let token = localStorage.getItem('ea_token') || null;
let userEmail = localStorage.getItem('ea_email') || null;
let empresa = null;
let empresas = [];
let lancamentos = [];
let pagina = 1;
const PP = 20;
let cFluxo = null, cDonut = null;

function fmt(v){ return 'R$ '+(parseFloat(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtD(d){ if(!d) return '-'; const p=d.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }

async function api(fn, params){
  const r = await fetch(SB_URL+'/rest/v1/rpc/'+fn, {
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+token},
    body:JSON.stringify(params)
  });
  if(!r.ok) return null;
  return r.json();
}

// LOGIN
document.getElementById('btn-entrar').addEventListener('click', async function(){
  const email = document.getElementById('inp-email').value.trim();
  const senha = document.getElementById('inp-senha').value;
  if(!email || !senha) return;
  this.disabled=true; this.textContent='Entrando...';
  document.getElementById('erro').style.display='none';
  try {
    const r = await fetch(SB_URL+'/auth/v1/token?grant_type=password', {
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SB_KEY},
      body:JSON.stringify({email, password:senha})
    });
    const d = await r.json();
    if(!r.ok) throw new Error(d.error_description || d.message || 'Erro ao entrar');
    token = d.access_token;
    userEmail = email;
    localStorage.setItem('ea_token', token);
    localStorage.setItem('ea_email', email);
    await iniciar();
  } catch(e){
    document.getElementById('erro').textContent = e.message;
    document.getElementById('erro').style.display='block';
    this.disabled=false; this.textContent='Entrar';
  }
});

document.getElementById('inp-senha').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('btn-entrar').click(); });

async function verificarSessao(){
  if(!token) return;
  const r = await fetch(SB_URL+'/auth/v1/user', { headers:{'apikey':SB_KEY,'Authorization':'Bearer '+token} });
  if(r.ok) await iniciar();
  else { token=null; localStorage.removeItem('ea_token'); }
}

function sair(){
  token=null; userEmail=null;
  localStorage.removeItem('ea_token'); localStorage.removeItem('ea_email');
  document.getElementById('login-page').style.display='flex';
  document.getElementById('portal-page').style.display='none';
}

async function iniciar(){
  document.getElementById('login-page').style.display='none';
  document.getElementById('portal-page').style.display='block';
  document.getElementById('u-av').textContent=(userEmail||'?')[0].toUpperCase();
  document.getElementById('u-nome').textContent=(userEmail||'').split('@')[0];
  document.getElementById('u-email').textContent=userEmail||'';
  const data = await api('fn_empresas_do_usuario',{});
  if(data && data.length){
    empresas=data; empresa=data[0];
    const sel=document.getElementById('sb-sel');
    sel.innerHTML=data.map(e=>'<option value="'+e.empresa_id+'">'+e.empresa_nome+'</option>').join('');
  } else {
    empresa={empresa_id:'d72464a0-3308-4bcc-8b38-b92bb0e90547',empresa_nome:'BJ Solutions'};
    document.getElementById('sb-sel').innerHTML='<option value="'+empresa.empresa_id+'">'+empresa.empresa_nome+'</option>';
  }
  document.getElementById('b-emp').textContent=empresa.empresa_nome;
  await carregarDados();
}

async function trocarEmp(id){
  empresa=empresas.find(e=>e.empresa_id===id)||empresa;
  document.getElementById('b-emp').textContent=empresa.empresa_nome;
  await carregarDados();
}

function getF(){
  const g=id=>{ const e=document.getElementById(id); return e?e.value||null:null; };
  return {
    p_empresa_id:empresa.empresa_id,
    p_ano:parseInt(g('f-ano'))||null, p_trimestre:parseInt(g('f-tri'))||null, p_mes:parseInt(g('f-mes'))||null,
    p_data_inicio:g('f-di'), p_data_fim:g('f-df'), p_status:g('f-status'), p_origem_aba:g('f-aba')
  };
}

async function carregarDados(){
  document.getElementById('conteudo').innerHTML=htmlDash();
  await Promise.all([carregarFiltros(),carregarKPIs(),carregarFluxo(),carregarDonut(),carregarLanc()]);
}

    <select class="fs" id="f-mes"><option value="">Mes</option><option value="1">Jan</option><option value="2">Fev</option><option value="3">Mar</option><option value="4">Abr</option><option value="5">Mai</option><option value="6">Jun</option><option value="7">Jul</option><option value="8">Ago</option><option value="9">Set</option><option value="10">Out</option><option value="11">Nov</option><option value="12">Dez</option></select>

  </div>

  <div class="charts">
    <div class="cc"><div class="cc-titulo">Fluxo de Caixa Mensal</div><div class="cc-sub">Receitas vs Despesas por mes</div><canvas id="c-fl" height="230"></canvas></div>
    <div class="cc"><div class="cc-titulo">Composicao</div><div class="cc-sub">Realizado vs previsto</div><canvas id="c-do" height="230"></canvas></div>
  </div>
  <div class="tbl-card">
    <div class="tbl-hdr"><div class="tbl-titulo">Lancamentos</div><span id="tc" style="font-size:11px;color:#9a8aa2">-</span></div>
    <div class="tbl-filt">
      <select class="fs" id="tf-t" onchange="filtTab()" style="font-size:11px;padding:3px 8px"><option value="">Todos</option><option value="entrada">Entradas</option><option value="saida">Saidas</option></select>
      <select class="fs" id="tf-s" onchange="filtTab()" style="font-size:11px;padding:3px 8px"><option value="">Todos status</option><option value="realizado">Realizado</option><option value="previsto">Previsto</option></select>
      <input type="text" class="fi" id="tf-b" placeholder="Buscar..." oninput="filtTab()" style="font-size:11px;padding:3px 8px;min-width:140px">
    </div>
    <div id="tb"></div>
    <div class="pag" id="paginacao" style="display:none"><span id="pi">-</span><div class="pag-btns" id="pb"></div></div>
  </div>`;
}

async function carregarFiltros(){
  const d=await api('fn_filtros_disponiveis',{p_empresa_id:empresa.empresa_id});
  if(!d||!d[0]) return;
  const ae=document.getElementById('f-ano'); if(!ae) return;
  ae.innerHTML='<option value="">Todos os anos</option>';
  (d[0].anos||[]).forEach(a=>{const o=document.createElement('option');o.value=a;o.textContent=a;ae.appendChild(o);});
  const an=new Date().getFullYear(); if((d[0].anos||[]).includes(an)) ae.value=an;
  const ab=document.getElementById('f-aba'); if(!ab) return;
  ab.innerHTML='<option value="">Todas fontes</option>';
  (d[0].abas_disponiveis||[]).forEach(a=>{const o=document.createElement('option');o.value=a;o.textContent=a;ab.appendChild(o);});
}

async function carregarKPIs(){
  const d=await api('fn_kpis_financeiros',getF()); const k=(d||[{}])[0]||{};
  const res=parseFloat(k.resultado_realizado)||0, rec=parseFloat(k.receita_realizada)||0;
  const mg=rec>0?((res/rec)*100).toFixed(1):0;
  const el=document.getElementById('kpis'); if(!el) return;
  el.innerHTML=`
    <div class="kpi r"><div class="kp-lb">Receita Realizada</div><div class="kp-vl" style="color:#16a34a">${fmt(k.receita_realizada)}</div><div class="kp-sb">Prevista: ${fmt(k.receita_prevista)}</div></div>
    <div class="kpi d"><div class="kp-lb">Despesa Realizada</div><div class="kp-vl" style="color:#dc2626">${fmt(k.despesa_realizada)}</div><div class="kp-sb">Prevista: ${fmt(k.despesa_prevista)}</div></div>
    <div class="kpi re"><div class="kp-lb">Resultado</div><div class="kp-vl" style="color:${res>=0?'#16a34a':'#dc2626'}">${fmt(k.resultado_realizado)}</div><div class="kp-sb">Previsto: ${fmt(k.resultado_previsto)}</div></div>
    <div class="kpi t"><div class="kp-lb">Lancamentos</div><div class="kp-vl">${(parseInt(k.qtd_receitas)||0)+(parseInt(k.qtd_despesas)||0)}</div><div class="kp-sb">Entradas: ${k.qtd_receitas||0} | Saidas: ${k.qtd_despesas||0}</div></div>`;
  const em=document.getElementById('kmini'); if(!em) return;
  em.innerHTML=`
    <div class="km"><div><div class="km-lb">Margem</div><div class="km-vl" style="color:var(--roxo)">${mg}%</div></div><span class="pill ${parseFloat(mg)>=0?'pg':'pr'}">${parseFloat(mg)>=0?'Positiva':'Negativa'}</span></div>
    <div class="km"><div><div class="km-lb">A Receber</div><div class="km-vl" style="color:#2563eb">${fmt(k.receita_prevista)}</div></div><span class="pill pb">Previsto</span></div>
    <div class="km"><div><div class="km-lb">A Pagar</div><div class="km-vl" style="color:#dc2626">${fmt(k.despesa_prevista)}</div></div><span class="pill pr">Previsto</span></div>`;
}

async function carregarFluxo(){
  const f=getF(); const d=await api('fn_fluxo_mensal',{p_empresa_id:empresa.empresa_id,p_ano:f.p_ano,p_trimestre:f.p_trimestre,p_status:f.p_status})||[];
  const el=document.getElementById('c-fl'); if(!el) return;
  if(cFluxo) cFluxo.destroy();
  if(typeof Chart==='undefined') return;
  cFluxo=new Chart(el.getContext('2d'),{type:'bar',data:{labels:d.map(x=>x.mes_nome),datasets:[{label:'Receitas',data:d.map(x=>parseFloat(x.receita)||0),backgroundColor:'rgba(22,163,74,.7)',borderRadius:4},{label:'Despesas',data:d.map(x=>parseFloat(x.despesa)||0),backgroundColor:'rgba(220,38,38,.7)',borderRadius:4},{label:'Resultado',data:d.map(x=>parseFloat(x.resultado)||0),type:'line',borderColor:'#671e75',backgroundColor:'rgba(103,30,117,.08)',tension:.4,pointRadius:3,fill:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#9a8aa2',font:{size:11}}},y:{ticks:{color:'#9a8aa2',font:{size:11},callback:v=>'R$'+(v/1000).toFixed(0)+'k'}}}}});
}

async function carregarDonut(){
  const d=await api('fn_kpis_financeiros',getF()); const k=(d||[{}])[0]||{};
  const el=document.getElementById('c-do'); if(!el) return;
  if(cDonut) cDonut.destroy();
  if(typeof Chart==='undefined') return;
  cDonut=new Chart(el.getContext('2d'),{type:'doughnut',data:{labels:['Rec.Real','Rec.Prev','Desp.Real','Desp.Prev'],datasets:[{data:[parseFloat(k.receita_realizada)||0,parseFloat(k.receita_prevista)||0,parseFloat(k.despesa_realizada)||0,parseFloat(k.despesa_prevista)||0],backgroundColor:['rgba(22,163,74,.85)','rgba(22,163,74,.25)','rgba(220,38,38,.85)','rgba(220,38,38,.25)'],borderColor:'#fff',borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom',labels:{color:'#5a4d62',font:{size:11},padding:8,boxWidth:10}},tooltip:{callbacks:{label:c=>' '+fmt(c.raw)}}}}});
}

async function carregarLanc(){
  const d=await api('fn_lancamentos',{...getF(),p_limit:500,p_offset:0});
  lancamentos=d||[]; pagina=1; renderTab();
}

function filtTab(){
  const t=document.getElementById('tf-t')?.value||'', s=document.getElementById('tf-s')?.value||'', b=(document.getElementById('tf-b')?.value||'').toLowerCase();
  pagina=1; renderTab(lancamentos.filter(l=>(!t||l.tipo===t)&&(!s||l.status===s)&&(!b||(l.descricao||'').toLowerCase().includes(b))));
}

function renderTab(lista){
  lista=lista||lancamentos;
  const total=lista.length, ini=(pagina-1)*PP, pag=lista.slice(ini,ini+PP), tp=Math.ceil(total/PP);
  const tc=document.getElementById('tc'); if(tc) tc.textContent=total+' lancamentos';
  const tb=document.getElementById('tb'); if(!tb) return;
  if(!pag.length){tb.innerHTML='<div class="vazio">Nenhum lancamento</div>';const pg=document.getElementById('paginacao');if(pg)pg.style.display='none';return;}
  tb.innerHTML='<table><thead><tr><th>Data</th><th>Descricao</th><th>Categoria</th><th>Conta</th><th>Fonte</th><th>Tipo</th><th>Status</th><th style="text-align:right">Valor</th></tr></thead><tbody>'+pag.map(l=>`<tr><td style="color:#9a8aa2;font-size:12px;white-space:nowrap">${fmtD(l.data)}</td><td class="desc" title="${(l.descricao||'').replace(/"/g,'')}">${l.descricao||'-'}</td><td>${l.categoria_nome||'-'}</td><td>${l.conta_nome||'-'}</td><td style="font-size:10px;color:#9a8aa2">${l.origem_aba||'-'}</td><td><span class="badge b-${l.tipo}">${l.tipo}</span></td><td><span class="badge b-${l.status}">${l.status}</span></td><td class="val ${l.tipo==='entrada'?'ent':'sai'}">${l.tipo==='saida'?'-':''}${fmt(l.valor)}</td></tr>`).join('')+'</tbody></table>';
  const pg=document.getElementById('paginacao'); if(pg) pg.style.display='flex';
  const pi=document.getElementById('pi'); if(pi) pi.textContent=(ini+1)+'-'+Math.min(ini+PP,total)+' de '+total;
  const pbEl=document.getElementById('pb'); if(!pbEl) return; pbEl.innerHTML='';
  const pv=document.createElement('button');pv.className='pb2';pv.textContent='Anterior';pv.disabled=pagina===1;pv.onclick=()=>{pagina--;renderTab(lista);};pbEl.appendChild(pv);
  const s2=Math.max(1,pagina-2),e2=Math.min(tp,s2+4);
  for(let p=s2;p<=e2;p++){const b=document.createElement('button');b.className='pb2'+(p===pagina?' at':'');b.textContent=p;const pp=p;b.onclick=()=>{pagina=pp;renderTab(lista);};pbEl.appendChild(b);}
  const nx=document.createElement('button');nx.className='pb2';nx.textContent='Proximo';nx.disabled=pagina===tp;nx.onclick=()=>{pagina++;renderTab(lista);};pbEl.appendChild(nx);
}

function limpar(){['f-ano','f-tri','f-mes','f-status','f-aba','f-di','f-df'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});carregarDados();}

verificarSessao();
</script>
